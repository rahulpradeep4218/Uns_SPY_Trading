[project]
name = "rahul-trading"
version = "1.0.0"
description = "Trading platform that uses ML Models to predict moves and can trade automatically with a Schwabs Account"
authors = [
    { name = "Rahul Pradeep", email = "rahulpradeep4218@gmail.com" }
    ]
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Shared dependencies
[tool.poetry.dependencies]
python = ">=3.11,<3.12"


# Streamlit UI
[tool.poetry.group.streamlit.dependencies]
streamlit = ">=1.49,<1.50"
numpy = ">=2.2,<2.3"
pandas = ">=2.3,<2.4"
scikit-learn = ">=1.7,<1.8"
matplotlib = ">=3.10,<3.11"
pyyaml = ">=6.0,<6.1"
openpyxl = ">=3.1,<3.2"
plotly = ">=6.3,<6.4"
xgboost = ">=3.0,<3.1"
optuna = ">=4.5,<4.6"
optuna_integration = ">=4.5,<4.6"
TA-Lib = ">=0.6,<0.7"
pyarrow = ">=21.0,<21.1"
mlflow = ">=3.2,<3.3"
dagster = ">=1.11,<1.12"
duckdb = ">=1.3,<1.4"
"ruamel.yaml" = ">=0.18,<0.19"
lightweight-charts = ">=2.1,<2.2"


# Backend API
[tool.poetry.group.backend.dependencies]
fastapi = ">=0.115,<0.116"
uvicorn = { version = ">=0.35,<0.36", extras = ["standard"] }
requests = ">=2.32,<2.33"
pandas = ">=2.3,<2.4"
numpy = ">=2.2,<2.3"
sqlalchemy = ">=2.0,<2.1"
pydantic = ">=2.11,<2.12"
psycopg2-binary = ">=2.9,<3.0"
python-multipart = ">=0.0.20,<0.1"
"ruamel.yaml" = ">=0.18,<0.19"
apscheduler = ">=3.11,<3.12"


# MLflow
[tool.poetry.group.mlflow.dependencies]
mlflow = ">=3.2,<3.3"
psycopg2-binary = ">=2.9,<3.0"

# Dagster
[tool.poetry.group.dagster.dependencies]
dagster = ">=1.11,<1.12"
dagster-graphql = ">=1.11,<1.12"
dagster-webserver = ">=1.11,<1.12"
dagster-postgres = ">=0.27,<0.28"
dagster-docker = ">=0.27,<0.28"

# Dagster Code
[tool.poetry.group.dagster_code.dependencies]
dagster = ">=1.11,<1.12"
dagster-postgres = ">=0.27,<0.28"
dagster-docker = ">=0.27,<0.28"
numpy = ">=2.2,<2.3"