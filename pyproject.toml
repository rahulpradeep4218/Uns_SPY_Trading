[tool.poetry]
name = "rahul-trading"
version = "1.0.0"
description = "Trading platform that uses ML Models to predict moves and can trade automatically with a Schwabs Account"
authors = ["rahulpradeep4218 <rahulpradeep4218@gmail.com>"]
readme = "README.md"

# Shared dependencies
[tool.poetry.dependencies]
python = "^3.11"


# Streamlit UI
[tool.poetry.group.streamlit.dependencies]
streamlit = "^1.49"
numpy = "^2.2"
pandas = "^2.3"
scikit-learn = "^1.7"
matplotlib = "^3.10"
pyyaml = "^6.0"
openpyxml = "^3.1"
plotly = "^6.3"
xgboost = "^3.0"
optuna = "^4.5"
optuna_integration = "^4.5"
TA-Lib = "^0.6"
pyarrow = "^21.0"
mlflow = "^3.3.2"
dagster = "^1.11"
duckdb = "^1.3"
ruamel.yaml = "^0.18"
lightweight-charts = "^2.1"


# Backend API
[tool.poetry.group.backend.dependencies]
fastapi = "^0.109"
uvicorn = { version = "^0.35", extras = ["standard"] }
requests = "^2.32"
pandas = "^2.3"
numpy = "^2.2"
sqlalchemy = "^2.0"
pydantic = "^2.11"
psycopg2-binary = "^2.9"
python-multipart = "0.0.20"
ruamel.yaml = "^0.18"
apscheduler = "^3.11"


# MLflow
[tool.poetry.group.mlflow.dependencies]
mlflow = "^3.2"
psycopg2-binary = "^2.9"

# Dagster
[tool.poetry.group.dagster.dependencies]
dagster = "^1.11"
dagster-graphql = "^1.11"
dagster-webserver = "^1.11"
dagster-postgres = "^0.27"
dagster-docker = "^0.27"