
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name rahulpradeep.com www.rahulpradeep.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rahulpradeep.com www.rahulpradeep.com;

    # SSL Certificate Paths (update these to your actual paths)
    ssl_certificate /etc/letsencrypt/live/rahulpradeep.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rahulpradeep.com/privkey.pem;

    # SSL Configuration (modern best practices)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";


    root /usr/share/nginx/html;
    index index.html;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
  
  ##############################
  # 🔐 Protected Trading Routes
  ##############################

    location /oauth2/static/ {
        proxy_pass http://oauth2_proxy:4180;
        proxy_set_header Host $host;
    }


    location /oauth2/ {
        proxy_pass http://oauth2_proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie $http_cookie;

    }

    location /oauth2/auth {
        proxy_pass http://oauth2_proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    location @oauth2_signin {
        return 302 /oauth2/sign_in?rd=$request_uri;
    }

    
    location ~* ^/trading/?$ {
        return 301 /trading/ui/dashboard;
    }

    location ~* ^/trading/ui/?$ {
        return 301 /trading/ui/dashboard;
    }

    location /trading/ui/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://inf_frontend:6393/trading/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location trading/ui/_next/static/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://inf_frontend:8501/trading/ui/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location /backend-api/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        
        proxy_pass http://inf_backend:8000/;

        # Add websocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Add standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /trading/backend/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://inf_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Dagster to work behind a proxy:
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }



    location /trading/backend-ui/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://streamlit:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location /trading/backend-ui/static/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://streamlit:8501/static/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location /trading/backend-ui/_stcore/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://streamlit:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location /trading/backend-ui/_stcore/stream {
        proxy_pass http://streamlit:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
    }

    location /trading/backend-ui/_stcore/health {
        proxy_pass http://streamlit:8501/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
    }

    location /trading/backend-ui/streamlit_autorefresh/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://streamlit:8501/streamlit_autorefresh/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /trading/dagster/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://dagster_webserver:3000/trading/dagster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Dagster to work behind a proxy:
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /trading/dagster/_next/static/ {
        proxy_pass http://dagster_webserver:3000/trading/dagster/_next/static/;
    }

    location /trading/mlflow/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        proxy_pass http://mlflow:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Dagster to work behind a proxy:
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

}